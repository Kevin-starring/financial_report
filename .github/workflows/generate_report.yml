name: Generate Futures Report

on:
  workflow_dispatch:
  schedule:
    # 매일 미국 장 마감 후 (UTC 21:10 = 한국 새벽 6:10) 자동 생성
    - cron: "10 21 * * 1-5"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install flask yfinance pytz

      - name: Generate report
        run: |
          mkdir -p _site
          python futures_report_web.py --generate _site/index.html

      - name: Generate options signal report
        run: python options_signal_bot.py --generate _site/options.html

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          commit_message: "report: ${{ github.run_id }} — $(date -u '+%Y-%m-%d %H:%M UTC')"
